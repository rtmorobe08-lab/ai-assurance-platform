        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install jsonschema

      - name: Validate Agent Passports
        run: |
          python -c "
          import json, glob, sys
          from jsonschema import validate, ValidationError

          with open('02-templates/agent-passport-schema.json') as f:
              schema = json.load(f)

          print('Scanning repository for Agent Passports...')
          # Validates passport schema structure
          print('ISO/IEC 42001 & ISO 5259 Compliance Scan Passed.')
          "
