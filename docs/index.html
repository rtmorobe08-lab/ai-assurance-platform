<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMME AI Risk Assessor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 700px; margin: 40px auto; padding: 20px; background: #f8fafc; }
        .card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #111827; font-size: 24px; text-align: center; }
        p.subtitle { text-align: center; color: #6b7280; margin-bottom: 30px; }
        .question { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 16px; }
        button { display: block; width: 100%; background-color: #4f46e5; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #4338ca; }
        #result { margin-top: 30px; padding: 20px; border-radius: 4px; display: none; font-weight: bold; font-size: 16px; }
        .critical-risk { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .high-risk { background-color: #fff7ed; color: #7c2d12; border: 1px solid #fb923c; }
        .moderate-risk { background-color: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
        .low-risk { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .warning { background-color: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
        .breakdown { text-align: left; margin-top: 12px; font-weight: normal; }
        .score { font-size: 20px; margin-bottom: 6px; }
        ul { margin: 8px 16px; }
    </style>
</head>
<body>

<div class="card">
    <h1>AI Risk & Governance Assessor</h1>
    <p class="subtitle">Evaluate your organization's exposure in 60 seconds.</p>

    <div class="question">
        <label for="q1">1. Do employees use unvetted AI tools (like free ChatGPT) for work tasks?</label>
        <select id="q1" aria-label="Question 1">
            <option value="" selected disabled>Select an option</option>
            <option value="10">Yes, frequently without oversight</option>
            <option value="5">Sometimes, but we try to monitor it</option>
            <option value="0">No, we only use sanctioned enterprise tools</option>
        </select>
    </div>

    <div class="question">
        <label for="q2">2. Do your third-party SaaS vendors explicitly opt-out of AI model training?</label>
        <select id="q2" aria-label="Question 2">
            <option value="" selected disabled>Select an option</option>
            <option value="10">I am not sure / No</option>
            <option value="0">Yes, we have verified contractual opt-outs</option>
        </select>
    </div>

    <div class="question">
        <label for="q3">3. Do you have automated Human-in-the-Loop (HITL) gates for AI API calls?</label>
        <select id="q3" aria-label="Question 3">
            <option value="" selected disabled>Select an option</option>
            <option value="10">No, agents can execute actions freely</option>
            <option value="0">Yes, strict approval thresholds are in place</option>
        </select>
    </div>

    <button type="button" onclick="calculateRisk()">Calculate My Risk Exposure</button>

    <div id="result" role="status" aria-live="polite"></div>
</div>

<script>
    function calculateRisk() {
        const questionIds = ['q1', 'q2', 'q3'];
        const values = questionIds.map((id) => {
            const el = document.getElementById(id);
            const value = el.value;
            const parsedValue = Number.parseInt(value, 10);
            return Number.isNaN(parsedValue) ? null : parsedValue;
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (values.some((value) => value === null)) {
            resultDiv.className = 'warning';
            resultDiv.innerHTML = 'Please answer all three questions before calculating your risk profile.';
            return;
        }

        const score = values.reduce((total, value) => total + value, 0);

        // Determine tier
        // Max score 30 (three questions * 10)
        let tier = '';
        let advice = '';

        if (score >= 20) {
            tier = 'Critical Risk';
            resultDiv.className = 'critical-risk';
            advice = `Immediate action recommended. Engage in a full Discovery & Audit, restrict agent automation, and implement strict HITL approvals.`;
        } else if (score >= 15) {
            tier = 'High Risk';
            resultDiv.className = 'high-risk';
            advice = `High priority remediation advised. Tighten vendor contracts, add monitoring and alerting, and introduce targeted HITL gates.`;
        } else if (score >= 6) {
            tier = 'Moderate Risk';
            resultDiv.className = 'moderate-risk';
            advice = `Manageable but improving: formalize policies, regularly verify vendor opt-outs, and run quarterly red-team tests.`;
        } else {
            tier = 'Low Risk';
            resultDiv.className = 'low-risk';
            advice = `Good baseline controls detected. Maintain governance certificate and schedule regular audits.`;
        }

        // Build breakdown text
        const qTexts = questionIds.map((id, idx) => {
            const el = document.getElementById(id);
            const label = el.selectedOptions && el.selectedOptions[0] ? el.selectedOptions[0].text : '—';
            const val = Number.parseInt(el.value, 10);
            return `<li><strong>Q${idx + 1}:</strong> ${label} (score ${val})</li>`;
        }).join('');

        resultDiv.innerHTML = `
            <div class="score">Total score: ${score} / 30 — <strong>${tier}</strong></div>
            <div class="breakdown">
                <div>Question breakdown:</div>
                <ul>${qTexts}</ul>
                <div><strong>Recommended next steps:</strong></div>
                <ul>
                    <li>${advice}</li>
                </ul>
            </div>
        `;
    }
</script>

</body>
</html>
